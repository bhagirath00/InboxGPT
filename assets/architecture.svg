<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" fill="none">
  <defs>
    <!-- Monochrome Arrow Markers -->
    <marker id="arrow-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d4d4d8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#71717a"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- ==================== FLOW CONNECTORS & ARROWS ==================== -->

  <!-- 1. User Instruction -> LangGraph Node -->
  <path d="M 380 62 L 380 102" stroke="#a1a1aa" stroke-width="1.8" marker-end="url(#arrow-white)"/>

  <!-- 2. LangGraph Node -> Agent Decides Tool (Diamond) -->
  <path d="M 380 158 L 380 198" stroke="#a1a1aa" stroke-width="1.8" marker-end="url(#arrow-white)"/>

  <!-- 3. LangGraph Node -> Executive Synthesis & Report (Right) -->
  <path d="M 480 130 L 590 130 L 590 185 L 638 185" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-white)"/>
  <!-- Label: Result (shieldcn outline badge) -->
  <rect x="520" y="118" width="54" height="20" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
  <text x="547" y="132" fill="#d4d4d8" font-size="10" font-weight="500" text-anchor="middle" class="mono">Result</text>

  <!-- 4. Diamond -> 4 Tool Boxes (Downwards with Badges) -->
  <!-- Search Connector -->
  <path d="M 330 270 L 115 270 L 115 428" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-white)"/>
  <!-- Read Connector -->
  <path d="M 350 295 L 350 355 L 315 355 L 315 428" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-white)"/>
  <!-- Draft Connector -->
  <path d="M 410 295 L 410 355 L 515 355 L 515 428" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-white)"/>
  <!-- Recall/Store Connector -->
  <path d="M 430 270 L 715 270 L 715 428" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-white)"/>

  <!-- Pill Badges on Branch Lines (Exact shieldcn outline badge style) -->
  <!-- Search Pill -->
  <rect x="88" y="325" width="54" height="22" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
  <text x="115" y="340" fill="#f4f4f5" font-size="11" font-weight="500" text-anchor="middle" class="sans">Search</text>

  <!-- Read Pill -->
  <rect x="292" y="365" width="46" height="22" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
  <text x="315" y="380" fill="#f4f4f5" font-size="11" font-weight="500" text-anchor="middle" class="sans">Read</text>

  <!-- Draft Pill -->
  <rect x="492" y="365" width="46" height="22" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
  <text x="515" y="380" fill="#f4f4f5" font-size="11" font-weight="500" text-anchor="middle" class="sans">Draft</text>

  <!-- Recall / Store Pill -->
  <rect x="665" y="325" width="100" height="22" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
  <text x="715" y="340" fill="#f4f4f5" font-size="11" font-weight="500" text-anchor="middle" class="sans">Recall / Store</text>

  <!-- 5. Loopback Lines: From 4 Tool Boxes back UP into LangGraph ReAct Node -->
  <!-- Loop from search_mailbox -->
  <path d="M 65 432 L 65 170 L 320 170 L 320 160" stroke="#52525b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
  <!-- Loop from read_email_details -->
  <path d="M 270 432 L 270 180 L 340 180 L 340 160" stroke="#52525b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
  <!-- Loop from create_email_draft -->
  <path d="M 560 432 L 560 180 L 420 180 L 420 160" stroke="#52525b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
  <!-- Loop from save_agent_memory -->
  <path d="M 765 432 L 765 170 L 440 170 L 440 160" stroke="#52525b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

  <!-- ==================== FLOW NODES / BOXES (OUTLINE STYLE) ==================== -->

  <!-- NODE 1: User Instruction (Top) -->
  <g transform="translate(290, 18)">
    <rect width="180" height="44" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="90" y="27" fill="#f4f4f5" font-size="13" font-weight="500" text-anchor="middle" class="sans">User Instruction</text>
  </g>

  <!-- NODE 2: LangGraph ReAct Node (Middle) -->
  <g transform="translate(275, 104)">
    <rect width="210" height="54" rx="6" fill="#09090b" stroke="#52525b" stroke-width="1.4"/>
    <text x="105" y="26" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle" class="sans">LangGraph</text>
    <text x="105" y="43" fill="#a1a1aa" font-size="12" font-weight="400" text-anchor="middle" class="mono">ReAct Node</text>
  </g>

  <!-- NODE 3: Diamond Decision: Agent Decides Tool -->
  <g transform="translate(380, 270)">
    <path d="M 0 -70 L 80 0 L 0 70 L -80 0 Z" fill="#09090b" stroke="#52525b" stroke-width="1.4"/>
    <text x="0" y="-6" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" class="sans">Agent Decides</text>
    <text x="0" y="14" fill="#a1a1aa" font-size="13" font-weight="500" text-anchor="middle" class="sans">Tool</text>
  </g>

  <!-- NODE 4: Executive Synthesis & Report (Right) -->
  <g transform="translate(640, 155)">
    <rect width="170" height="60" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="85" y="26" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" class="sans">Executive</text>
    <text x="85" y="44" fill="#a1a1aa" font-size="12" font-weight="400" text-anchor="middle" class="sans">Synthesis &amp; Report</text>
  </g>

  <!-- ==================== BOTTOM 4 TOOL BOXES (OUTLINE STYLE) ==================== -->

  <!-- Tool 1: search_mailbox -->
  <g transform="translate(30, 432)">
    <rect width="170" height="48" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="85" y="29" fill="#f4f4f5" font-size="12" font-weight="500" text-anchor="middle" class="mono">search_mailbox</text>
  </g>

  <!-- Tool 2: read_email_details -->
  <g transform="translate(230, 432)">
    <rect width="170" height="48" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="85" y="29" fill="#f4f4f5" font-size="12" font-weight="500" text-anchor="middle" class="mono">read_email_details</text>
  </g>

  <!-- Tool 3: create_email_draft -->
  <g transform="translate(430, 432)">
    <rect width="170" height="48" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="85" y="29" fill="#f4f4f5" font-size="12" font-weight="500" text-anchor="middle" class="mono">create_email_draft</text>
  </g>

  <!-- Tool 4: save_agent_memory -->
  <g transform="translate(630, 432)">
    <rect width="170" height="48" rx="6" fill="#09090b" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="85" y="29" fill="#f4f4f5" font-size="12" font-weight="500" text-anchor="middle" class="mono">save_agent_memory</text>
  </g>
</svg>
