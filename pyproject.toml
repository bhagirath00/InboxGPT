[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inboxgpt"
version = "1.1.0"
description = "A terminal-first AI Gmail management agent with human-in-the-loop approval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "InboxGPT Team" }
]
dependencies = [
    "textual>=0.70.0",
    "rich>=13.7.0",
    "typer[all]>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
inboxgpt = "inboxgpt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["inboxgpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "agents-from-scratch",
    "email-agent",
    "inbox",
    ".venv",
]

